<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>belhome.cc — домашний хаб</title>
<meta name="description" content="Домашний хаб: Домовой, Home Assistant, курсы.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏡%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #edf0f4;
    --panel: #ffffff;
    --ink: #16202b;
    --muted: #5a6b7b;
    --line: #cdd5de;
    --accent: #3b5bdb;
    --shadow: 0 1px 2px rgba(22,32,43,.06), 0 8px 24px rgba(22,32,43,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12181f;
      --panel: #1b232d;
      --ink: #e8edf2;
      --muted: #93a3b3;
      --line: #2c3844;
      --accent: #7b96f0;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    padding: 40px 20px;
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: radial-gradient(1000px 500px at 100% -10%, rgba(59,91,219,.10), transparent 60%), var(--bg);
    color: var(--ink);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  header { text-align: center; }
  h1 {
    margin: 0 0 6px;
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 600;
    font-size: clamp(1.7rem, 4vw, 2.4rem);
    letter-spacing: -.01em;
  }
  header p { margin: 0; color: var(--muted); }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px;
    width: 100%;
    max-width: 720px;
  }
  @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
  .tile {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 22px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    text-decoration: none;
    color: inherit;
    transition: transform .15s ease, border-color .15s ease;
  }
  .tile:hover { transform: translateY(-3px); border-color: var(--accent); }
  .tile:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .tile .icon { font-size: 2rem; flex: none; }
  .tile h2 { margin: 0 0 2px; font-size: 1.05rem; font-weight: 600; }
  .tile p { margin: 0; font-size: .85rem; color: var(--muted); }
  footer { color: var(--muted); font-size: .8rem; }
</style>
</head>
<body>
<header>
  <h1>belhome.cc</h1>
  <p>Домашний хаб</p>
</header>
<nav class="grid">
  <a class="tile" href="https://our.belhome.cc">
    <span class="icon">🏠</span>
    <span><h2>Домовой</h2><p>Учёт домашнего имущества и гарантий</p></span>
  </a>
  <a class="tile" href="https://ha.belhome.cc">
    <span class="icon">💡</span>
    <span><h2>Home Assistant</h2><p>Управление умным домом</p></span>
  </a>
  <a class="tile" href="https://kurs.belhome.cc">
    <span class="icon">⚡</span>
    <span><h2>Kurs elektryka</h2><p>Od zera do SEP i praktyki</p></span>
  </a>
  <a class="tile" href="https://eng.belhome.cc">
    <span class="icon">🇬🇧</span>
    <span><h2>Английский</h2><p>Путь B1 → B2 → TOEFL iBT</p></span>
  </a>
</nav>
<footer>© 2026</footer>
</body>
</html>
